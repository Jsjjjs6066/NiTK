<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Natjecanja iz TK – zadaci i rješenja</title>
<style>
.file-option {
  display: flex;
  align-items: center;
  justify-content: center;
  box-sizing: border-box;
  height: 1.5em;
}
.file-option + .file-option { border-top: 1px solid #ccc; }
.file-option.selected { background-color: lightgreen; }
</style>
</head>
<body>
<h1>Natjecanja iz tehničke kulture</h1>
<p>Z = zadaci, R = rješenja, – = još nije dostupno</p>

<p>
  Preuzmi:
  <label><input type="radio" name="t" value="both" checked> oboje</label>
  <label><input type="radio" name="t" value="z"> zadaci</label>
  <label><input type="radio" name="t" value="r"> rješenja</label>
</p>

<div style="overflow-x:auto; white-space: nowrap;"><table id="tbl" border="1" cellpadding="4" cellspacing="0"></table></div>

<p>
  <button id="dl" disabled>Preuzmi odabrano (ZIP)</button>
  <button id="clr">Poništi odabir</button>
  <span id="cnt">Odabrano: 0 datoteka</span>
</p>
<p id="msg"></p>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
/* ===== POSTAVKE – prilagodi ===== */
const BASE = "natjecanja/";
const YEARS = ["2025./2026. (68.)", "2024./2025. (67.)", "2023./2024. (66.)", "2022./2023. (65.)", "2021./2022. (64.)", "2020./2021. (63.)", "2019./2020. (62.)"];
/* ================================= */
const LEVELS = [["s","Školsko","skolsko"],["z","Županijsko","zupanijsko"],["d","Državno","drzavno"]];
const GRADES = [5,6,7,8];
const sel = new Set();
const available = new Set();
const key = (y,l,g,t) => [y,l,g,t].join("|");
const exists = k => available.has(k);
const fname = (y,l,g,t) => `tk_${y.slice(0,4)}_${LEVELS.find(x=>x[0]===l)[2]}_${g}r_${t==="z"?"zadaci":"rjesenja"}.pdf`;

async function checkAvailability(){
  const keys = [];
  YEARS.forEach(y => LEVELS.forEach(([l]) => GRADES.forEach(g => ["z","r"].forEach(t => keys.push(key(y,l,g,t))))));
  let next = 0;
  const workers = Array.from({length: 8}, async () => {
    while (next < keys.length) {
      const k = keys[next++];
      const [y,l,g,t] = k.split("|");
      const name = fname(y,l,g,t);
      const response = await fetch(BASE+name, {method: "HEAD"});
      if (response.ok) {
        available.add(k);
      } else if (response.status!==404 && response.status!==410) {
        throw new Error(`Provjera datoteke ${name} nije uspjela (HTTP ${response.status}).`);
      }
    }
  });
  await Promise.all(workers);
}

function build(){
  let h = '<thead><tr><th rowspan="2">Godina</th>';
  LEVELS.forEach(([l,n]) => h += `<th colspan="4"><label><input type="checkbox" data-lvl="${l}"> ${n}</label></th>`);
  h += '</tr><tr>';
  LEVELS.forEach(([l]) => GRADES.forEach(g => h += `<th><label><input type="checkbox" data-lvl="${l}" data-gr="${g}"> ${g}.</label></th>`));
  h += '</tr></thead><tbody>';
  YEARS.forEach(y => {
    h += `<tr><td><label><input type="checkbox" data-yr="${y}"> ${y}</label></td>`;
    LEVELS.forEach(([l,n]) => GRADES.forEach(g => {
      h += '<td align="center">';
      ["z","r"].forEach(t => {
        const k = key(y,l,g,t);
        h += exists(k)
          ? `<span class="file-option"><label><input type="checkbox" data-file="${k}"><a href="${BASE+fname(y,l,g,t)}" target="_blank" title="${t==="z"?"Zadaci":"Rješenja"}, ${g}. razred, ${n.toLowerCase()}, ${y}">${t.toUpperCase()}</a></label></span>`
          : '<span class="file-option">–</span>';
      });
      h += '</td>';
    }));
    h += '</tr>';
  });
  document.getElementById("tbl").innerHTML = h + '</tbody>';
}

function filterOf(cb){
  return cb.dataset.yr ? (y => y===cb.dataset.yr)
    : cb.dataset.gr ? ((y,l,g) => l===cb.dataset.lvl && g==cb.dataset.gr)
    : ((y,l) => l===cb.dataset.lvl);
}
function allKeys(f){
  const out = [];
  YEARS.forEach(y => LEVELS.forEach(([l]) => GRADES.forEach(g => ["z","r"].forEach(t => {
    const k = key(y,l,g,t);
    if (exists(k) && f(y,l,g)) out.push(k);
  }))));
  return out;
}
function selectedType(){
  return document.querySelector('input[name=t]:checked').value;
}
function chosen(){
  const m = selectedType();
  return [...sel].filter(k => m==="both" || k.split("|")[3]===m);
}
function refresh(){
  const type = selectedType();
  document.querySelectorAll("input[data-file]").forEach(cb => {
    cb.checked = sel.has(cb.dataset.file);
    cb.disabled = type!=="both" && cb.dataset.file.split("|")[3]!==type;
  });
  document.querySelectorAll("#tbl input[data-file]").forEach(cb => {
    cb.closest(".file-option").classList.toggle("selected", sel.has(cb.dataset.file));
  });
  const n = chosen().length;
  document.getElementById("cnt").textContent = "Odabrano: " + n + " datoteka";
  document.getElementById("dl").disabled = n===0;
  document.getElementById("clr").disabled = n===0;
  document.querySelectorAll("input[data-yr],input[data-lvl]").forEach(cb => {
    const ks = allKeys(filterOf(cb)).filter(k => type==="both" || k.split("|")[3]===type);
    const c = ks.filter(k => sel.has(k)).length;
    cb.checked = ks.length>0 && c===ks.length;
    cb.indeterminate = c>0 && c<ks.length;
  });
}

async function initialize(){
  const msg = document.getElementById("msg");
  msg.textContent = "Provjeravam dostupnost datoteka…";
  try {
    await checkAvailability();
    build();
    refresh();
    msg.textContent = "";
  } catch (error) {
    console.error("Provjera dostupnosti datoteka nije uspjela.", error);
    msg.textContent = `Provjera dostupnosti datoteka nije uspjela: ${error.message}`;
  }
}

initialize();

document.getElementById("tbl").addEventListener("change", e => {
  const cb = e.target; if (cb.type!=="checkbox") return;
  if (cb.dataset.file) {
    cb.checked ? sel.add(cb.dataset.file) : sel.delete(cb.dataset.file);
    refresh();
    return;
  }
  const type = selectedType();
  allKeys(filterOf(cb)).filter(k => type==="both" || k.split("|")[3]===type)
    .forEach(k => cb.checked ? sel.add(k) : sel.delete(k));
  refresh();
});
document.querySelectorAll("input[name=t]").forEach(r => r.addEventListener("change", refresh));
document.getElementById("clr").onclick = () => { sel.clear(); refresh(); };

document.getElementById("dl").onclick = async () => {
  const msg = document.getElementById("msg"), btn = document.getElementById("dl");
  const zip = new JSZip(); let ok = 0; const fail = [];
  btn.disabled = true; msg.textContent = "Pripremam ZIP…";
  for (const k of chosen()) {
    const [y,l,g,t] = k.split("|"), name = fname(y,l,g,t);
    try {
      const r = await fetch(BASE+name);
      if (!r.ok) throw 0;
      zip.file(name, await r.blob()); ok++;
    } catch(_) { fail.push(name); }
  }
  if (ok) {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(await zip.generateAsync({type:"blob"}));
    a.download = "tk_natjecanja.zip"; a.click();
  }
  msg.textContent = fail.length ? `Preuzeto: ${ok}. Nije uspjelo: ${fail.join(", ")}` : `Gotovo, preuzeto datoteka: ${ok}.`;
  btn.disabled = false;
};
</script>
</body>
</html>
